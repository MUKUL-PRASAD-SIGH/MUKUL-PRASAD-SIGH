name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:                     # re-render right away when the generators change
    branches: [main, claude/youthful-maxwell-kozlkw]   # TEMP: test run on the feature branch
    paths:
      - ".github/workflows/update-profile-assets.yml"
      - ".github/profile-3d-settings.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false   # never kill a run halfway through its push

jobs:
  update-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN }}   # use PAT so commits are attributed to you
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The generators below are optional: when one fails, the last good images stay.
      - name: Generate profile summary cards
        id: summary
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: radical
          UTC_OFFSET: 5.5
          AUTO_PUSH: false

      - name: Restore previous summary cards if generation failed
        if: steps.summary.outcome != 'success'
        run: git checkout HEAD -- profile-summary-card-output 2>/dev/null || echo "No previous summary cards to restore"

      - name: Generate 3D contribution calendar
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Generate contribution snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      # Stats/streak/language cards (validated — a failed fetch keeps the old image),
      # pinned project cards, trophies, monthly chart, stat badges and the pulse line.
      - name: Refresh cards and README
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 scripts/update_profile.py

      # ─── Commit as YOU so it shows on your contribution graph ───────────────
      - name: Commit and push (counts as your contribution)
        run: |
          git config user.name "Mukul Prasad"
          git config user.email "mukulprasad958@gmail.com"

          for path in README.md assets profile-summary-card-output profile-3d-contrib; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping."
            exit 0
          fi
          git commit -m "🔄 profile sync · $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Push to the branch this run was started from (main for scheduled runs).
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not push after 3 attempts"
          exit 1
